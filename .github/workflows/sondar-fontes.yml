# Temporário: testa novas fontes de notícia antes de colocá-las no radar. Será removido.
name: Sondar fontes
on:
  push:
    branches: [profmartins94-eng-patch-1]
    paths:
      - ".github/sondagem/**"
      - ".github/workflows/sondar-fontes.yml"
permissions:
  contents: read
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/sondagem/sondar_fontes.py
