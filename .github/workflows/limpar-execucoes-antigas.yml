# Uso único, autorizado pelo dono do repositório: apaga os registros de execuções antigas
# do Actions, que apontavam para versões anteriores à limpeza do histórico.
# Este arquivo é removido logo depois.
name: Limpar execuções antigas

on:
  push:
    paths:
      - ".github/workflows/limpar-execucoes-antigas.yml"

permissions:
  actions: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Apagar execuções anteriores a 2026-10-06T21:03:54Z
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ESTA: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.created_at < "2026-10-06T21:03:54Z") | .id' > ids.txt
          echo "Execuções antigas encontradas: $(wc -l < ids.txt)"
          apagadas=0
          while read -r id; do
            [ "$id" = "$ESTA" ] && continue
            if gh api -X DELETE "repos/$REPO/actions/runs/$id" --silent; then
              apagadas=$((apagadas + 1))
            else
              echo "Não consegui apagar a execução $id"
            fi
          done < ids.txt
          echo "Apagadas: $apagadas"
          echo "Restantes anteriores à limpeza: $(gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.created_at < "2026-10-06T21:03:54Z") | .id' | wc -l)"
