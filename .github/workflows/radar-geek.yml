# Radar Geek: varre as notícias geek e publica a página noticias/ do site.
# Atualiza sozinho mais ou menos a cada 2 horas. Para rodar na hora: aba Ações > Radar Geek > Run workflow.
name: Radar Geek

on:
  workflow_dispatch:
  schedule:
    # O GitHub costuma atrasar ou pular rodadas agendadas. Por isso o radar tenta toda hora
    # e só atualiza quando a última atualização tem mais de ~2 horas (veja "verificar").
    - cron: "43 * * * *"
  push:
    paths:
      - "radar-geek/**"
      - ".github/workflows/radar-geek.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: radar-geek-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rodar: ${{ steps.hora.outputs.rodar }}
    steps:
      - uses: actions/checkout@v4

      - name: Ver se já está na hora de atualizar
        id: hora
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" != "schedule" ]; then
            echo "Rodada pedida à mão ou por mudança no código: atualiza agora."
            echo "rodar=sim" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          minutos=$(python3 - <<'EOF'
          import datetime as dt, json
          try:
              feito = json.load(open("noticias/news.json", encoding="utf-8"))["updatedAt"]
              antes = dt.datetime.fromisoformat(feito.replace("Z", "+00:00"))
              print(int((dt.datetime.now(dt.timezone.utc) - antes).total_seconds() // 60))
          except Exception:
              print(9999)
          EOF
          )
          echo "Última atualização há $minutos minutos."
          if [ "$minutos" -ge 110 ]; then echo "rodar=sim" >> "$GITHUB_OUTPUT"; else echo "rodar=nao" >> "$GITHUB_OUTPUT"; fi

  radar:
    needs: verificar
    if: needs.verificar.outputs.rodar == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Conferir o formato das notícias do site
        run: python3 -m unittest discover -s radar-geek -p 'test_*.py'

      - name: Rodar o radar
        env:
          TZ: America/Sao_Paulo
        run: >
          python3 radar-geek/radar_geek.py --traduzir --max 15 --nao-abrir
          --saida saida --pagina noticias/index.html --json noticias/news.json

      - name: Posts prontos para copiar
        if: always()
        run: cat saida/*.txt 2>/dev/null || echo "Nenhum relatório gerado."

      - name: Relatório compactado no log (para baixar sem o zip)
        if: always()
        run: |
          echo "=== INICIO RELATORIO (tar.gz em base64) ==="
          tar -czf - saida noticias 2>/dev/null | base64 -w0
          echo
          echo "=== FIM RELATORIO ==="

      - name: Salvar relatório (HTML + TXT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-geek
          path: |
            saida/
            noticias/
          if-no-files-found: ignore
          retention-days: 7

      # Só no main: grava a página nova no site (o GitHub Pages publica sozinho em seguida).
      - name: Publicar no site
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias/index.html
          if [ -f noticias/news.json ]; then git add noticias/news.json; fi
          if [ -f noticias/archive-index.json ]; then git add noticias/archive-index.json noticias/artigos/; fi
          if git diff --cached --quiet; then
            echo "A página não mudou."
            exit 0
          fi
          git commit -m "Radar Geek: atualiza as notícias"
          # Se outra rodada gravou a página ao mesmo tempo, fica a desta (a mais nova).
          for tentativa in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Não consegui enviar a página para o main." >&2
          exit 1

      # Push feito por robô não dispara o GitHub Pages sozinho: pedimos a atualização.
      - name: Atualizar o GitHub Pages
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          if ! gh api "repos/$repo/pages" --jq '"Pages publica de: " + .source.branch + " " + .source.path'; then
            echo "::warning::O GitHub Pages está desligado. Ligue em Settings > Pages > Branch: main / (root) > Save."
            exit 0
          fi
          gh api -X POST "repos/$repo/pages/builds" --jq '"Pedido de atualização: " + .status' \
            || echo "::warning::Não consegui pedir a atualização do GitHub Pages."

      - name: Conferir o site no ar
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          url="https://${{ github.repository_owner }}.github.io/noticias/"
          # Espera a página desta rodada, não a anterior (o Pages leva um ou dois minutos).
          esperado=$(grep -o 'Atualizado em [^·<]*' noticias/index.html | head -1)
          for tentativa in $(seq 1 9); do
            codigo=$(curl -s -o /tmp/pagina.html -w "%{http_code}" "$url?v=$(date +%s)")
            if [ "$codigo" = "200" ] && grep -qF "$esperado" /tmp/pagina.html; then
              echo "No ar: $url ($esperado)"
              exit 0
            fi
            echo "Tentativa $tentativa: HTTP $codigo, no ar: $(grep -o 'Atualizado em [^·<]*' /tmp/pagina.html | head -1)"
            sleep 20
          done
          echo "::warning::A página nova ($esperado) ainda não apareceu em $url (o Pages pode estar atrasado)"
